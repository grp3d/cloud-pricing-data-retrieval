# main: test → build + push the multi-arch image → apply to prod after manual approval
# (FR-034, research R14). The `prod` GitHub Environment must require a reviewer.
name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  TOFU_VERSION: "1.10.6"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements-dev.txt -r requirements-dagster.txt
      - run: pytest

  # One job under the `prod` environment so a single approval covers push + apply; the
  # apply role only trusts this environment (bootstrap github_oidc.tf).
  deploy:
    runs-on: ubuntu-24.04
    needs: [test]
    environment: prod   # required reviewer = the manual approval
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_APPLY_PROD }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64   # Fargate (Graviton) and amd64 home servers
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/cloud-pricing-pipeline-prod:${{ steps.tag.outputs.tag }}
          build-args: |
            GIT_SHA=${{ steps.tag.outputs.tag }}
            IMAGE_TAG=${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: apply data, then pipeline
        env:
          TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          for stack in data pipeline; do
            (
              cd infra/$stack
              tofu init -input=false -backend-config=../envs/prod.backend.hcl -backend-config="key=prod/$stack.tfstate"
              extra=""
              [ $stack = pipeline ] && extra="-var image_tag=$IMAGE_TAG"
              tofu apply -input=false -auto-approve -var-file=../envs/prod.tfvars $extra
            )
          done
