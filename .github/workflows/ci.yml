# Pull requests and merges to main: tests, image build (no push) and OpenTofu checks; on
# pull requests also a prod plan comment (FR-034). Deploys happen only from release tags
# (deploy.yml), so main always carries a green check without deploying.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write        # OIDC → AWS (no long-lived keys)
  pull-requests: write   # plan comment

env:
  TOFU_VERSION: "1.10.6"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      # Dagster tests must run in CI, not be skipped (constitution IV).
      - run: pip install -r requirements-dev.txt -r requirements-dagster.txt
      - run: pytest

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: false
          build-args: |
            GIT_SHA=${{ github.sha }}
            IMAGE_TAG=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  tofu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - run: tofu fmt -check -recursive infra/
      - name: validate and test (mocked AWS provider, no credentials)
        run: |
          for stack in bootstrap data pipeline; do
            (cd infra/$stack && tofu init -backend=false -input=false && tofu validate)
          done
          for stack in data pipeline; do
            (cd infra/$stack && tofu test)
          done

  plan:
    runs-on: ubuntu-24.04
    needs: [tofu]
    if: github.event_name == 'pull_request' && vars.AWS_ROLE_PLAN_PROD != ''
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_PLAN_PROD }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: plan data and pipeline
        env:
          TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}
        run: |
          : > plan.md
          for stack in data pipeline; do
            cd infra/$stack
            tofu init -input=false -backend-config=../envs/prod.backend.hcl -backend-config="key=prod/$stack.tfstate"
            tofu plan -input=false -lock=false -no-color -var-file=../envs/prod.tfvars \
              $( [ $stack = pipeline ] && echo "-var image_tag=${{ github.sha }}" ) > plan.txt
            { echo "### tofu plan: $stack"; echo '```'; grep -E '^(Plan:|No changes|  # )' plan.txt | head -80; echo '```'; } >> ../../plan.md
            cd ../..
          done
      - uses: actions/github-script@v7
        with:
          script: |
            const body = require('fs').readFileSync('plan.md', 'utf8');
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
