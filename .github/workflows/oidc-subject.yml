# Shows the OIDC subject GitHub issues to this repo's workflows, so the CI roles' trust
# (infra/bootstrap/github_oidc.tf, output gha_trust_subjects) can be checked against a real
# token. Prints only the identity claims, never the token. Needs no AWS access.
#
# Run it manually from main after changing the repo's OIDC subject template.
name: oidc-subject

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  show:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            core.info(`sub:         ${claims.sub}`);
            core.info(`ref:         ${claims.ref}`);
            core.info(`environment: ${claims.environment ?? '(none)'}`);
            core.info(`event_name:  ${claims.event_name}`);
            core.info('Compare "sub" with the run role entries in: tofu output gha_trust_subjects');
